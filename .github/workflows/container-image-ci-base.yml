name: WeeChat
on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      flavor:
        required: true
        type: string
      build-type:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: thehonker/weechat

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: ${{ inputs.base }}-${{ inputs.flavor }}
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone weechat repo, apply any patches
        run: |
          WEECHAT_REPO=https://github.com/weechat/weechat.git
          CLONE_DIR="${{ github.workspace }}/src/weechat"

          if [[ ${{ inputs.build-type }} == "tag" ]]; then
            GIT_REF="$(curl -fsSL 'https://api.github.com/repos/weechat/weechat/releases/latest' 2>/dev/null \
              | jq -r '.tag_name' \
              || true)"
            if [[ -z "${GIT_REF}" || "${GIT_REF}" == "null" ]]; then
              GIT_REF="$(curl -fsSL 'https://api.github.com/repos/weechat/weechat/releases?per_page=1' \
                | jq -r '.[0].tag_name')"
            fi
            if [[ -z "${GIT_REF}" || "${GIT_REF}" == "null" ]]; then
              echo "ERROR: Could not determine latest release tag"
              exit 1
            fi
            echo "Latest release: ${GIT_REF}"
            git clone --single-branch --branch "${GIT_REF}" --depth=1 "${WEECHAT_REPO}" "${CLONE_DIR}"
          else
            git clone --single-branch --branch main --depth=1 "${WEECHAT_REPO}" "${CLONE_DIR}"
            GIT_REF="$(cd "${CLONE_DIR}" && git rev-parse --short HEAD)"
          fi
          echo "GIT_REF=${GIT_REF}" >> "$GITHUB_ENV"

          # Apply patches
          cd "${CLONE_DIR}"
          for patch in "${{ github.workspace }}/patches/${{ inputs.base }}/"*.patch; do
            if test -f "$patch"; then
              echo "Applying patch $patch"
              git apply "$patch"
            fi
          done

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=raw,value=latest,priority=1000,prefix=${{ inputs.base }}-${{ inputs.flavor }}-,enable=${{ inputs.build-type == 'hash' }}
            type=raw,value=stable,priority=1000,prefix=${{ inputs.base }}-${{ inputs.flavor }}-,enable=${{ inputs.build-type == 'tag' }}
            type=schedule,enable=true,priority=900,pattern={{date 'YYYYMMDD'}},prefix=${{ inputs.base }}-${{ inputs.flavor }}-
            type=raw,value=${{ env.GIT_REF }},priority=800,prefix=${{ inputs.base }}-${{ inputs.flavor }}-
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and Push Image
        uses: docker/bake-action@v6
        with:
          source: .
          push: true
          files: |
            "./src/docker-bake.hcl"
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: build
          set: |
            build.dockerfile=Dockerfile.${{ inputs.base }}
            build.args.FLAVOR=${{ inputs.flavor }}

      - name: Write ref file
        run: |
          BASE="${{ inputs.base }}"
          FLAVOR="${{ inputs.flavor }}"
          TAG="${BASE}-${FLAVOR}"

          FULL_HASH="$(cd '${{ github.workspace }}/src/weechat' && git rev-parse HEAD)"
          SHORT_HASH="$(cd '${{ github.workspace }}/src/weechat' && git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%d)"

          mkdir -p refs
          echo "${GIT_REF}" > "refs/${TAG}-${{ inputs.build-type }}.txt"
          echo "${FULL_HASH}" >> "refs/${TAG}-${{ inputs.build-type }}.txt"
          echo "${SHORT_HASH}" >> "refs/${TAG}-${{ inputs.build-type }}.txt"
          echo "${BUILD_DATE}" >> "refs/${TAG}-${{ inputs.build-type }}.txt"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git add "refs/${TAG}-${{ inputs.build-type }}.txt"
            git commit -m "Update ref: ${TAG} ${BUILD_DATE} (${{ inputs.build-type }})"
            if git push; then break; fi
            sleep $((i * 5))
          done
